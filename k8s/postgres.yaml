apiVersion: v1
kind: Secret
metadata:
  name: garage-secrets
  namespace: garage-mot
type: Opaque
stringData:
  database-url: postgres://garage:garagepass@postgres:5432/garage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: garage-mot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: garage
            - name: POSTGRES_USER
              value: garage
            - name: POSTGRES_PASSWORD
              value: garagepass
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: garage-mot
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
