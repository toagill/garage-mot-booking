apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: garage-mot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: garage-mot-backend
      containers:
        - name: backend
          image: garage-mot-backend:latest
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: database-url
            - name: VEHICLE_API_MODE
              value: "dvla"
            - name: AWS_SECRET_NAME
              value: "garage-mot/dvla"
            - name: AWS_REGION
              value: "eu-west-2"
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: garage-mot
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
